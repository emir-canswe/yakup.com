<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yedigen Spiral — 2B & 3B</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital@0;1&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#070712;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
  font-family:'Crimson Text',serif;
  cursor: grab;
}
body:active{cursor:grabbing;}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1035 0%,#07071200 65%);z-index:0;pointer-events:none;}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

header{
  z-index:10;text-align:center;margin-bottom:1rem;
  pointer-events:none;
}
header h1{
  font-family:'Cinzel',serif;color:#c8a96e;font-size:1.05rem;
  letter-spacing:.35em;text-shadow:0 0 24px rgba(200,169,110,.55);
}
header p{color:#7766aa;font-size:.8rem;letter-spacing:.12em;font-style:italic;margin-top:.25rem;}

.stage{
  z-index:10;display:flex;gap:2.5rem;align-items:flex-start;
  pointer-events:none;
}

.panel{display:flex;flex-direction:column;align-items:center;gap:.5rem;}
.panel-label{
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.3em;
  color:#8866cc;text-transform:uppercase;
}

canvas{border-radius:4px; pointer-events:auto;}
#c2d{filter:drop-shadow(0 0 22px rgba(120,80,220,.45));}
#c3d{filter:drop-shadow(0 0 22px rgba(80,160,220,.45));}

.controls{
  z-index:10;display:flex;gap:1rem;margin-top:1.1rem;
}
button{
  font-family:'Cinzel',serif;background:transparent;
  border:1px solid #5533aa;color:#c8a96e;
  padding:.45rem 1.3rem;font-size:.7rem;letter-spacing:.2em;cursor:pointer;
  transition:all .3s;
}
button:hover{background:rgba(85,51,170,.3);border-color:#c8a96e;box-shadow:0 0 14px rgba(200,169,110,.25);}

.formula{
  z-index:10;color:#554488;font-size:.75rem;font-style:italic;
  margin-top:.7rem;letter-spacing:.05em;text-align:center;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>

<header>
  <h1>Yedigen Spiral Daralma Modeli</h1>
  <p>2 Boyutlu &nbsp;·&nbsp; 3 Boyutlu &nbsp;·&nbsp; Etkileşimli</p>
</header>

<div class="stage">
  <div class="panel">
    <div class="panel-label">2 Boyutlu</div>
    <canvas id="c2d" width="380" height="380"></canvas>
  </div>
  <div class="panel">
    <div class="panel-label">3 Boyutlu</div>
    <canvas id="c3d" width="380" height="380"></canvas>
  </div>
</div>

<div class="formula">Her yeni yedigenin alanı öncekinin 1/7'si &nbsp;|&nbsp; Çevirmek için ekranda sürükleyin</div>

<div class="controls">
  <button id="btnPlay">⏸ DURDUR</button>
  <button id="btnReset">↺ TEKRAR</button>
</div>

<script>
/* ── Stars ── */
(()=>{
  const sc=document.getElementById('stars');
  sc.width=window.innerWidth;sc.height=window.innerHeight;
  const sx=sc.getContext('2d');
  for(let i=0;i<140;i++){
    sx.beginPath();sx.arc(Math.random()*sc.width,Math.random()*sc.height,Math.random()*1.1,0,Math.PI*2);
    sx.fillStyle=`rgba(255,255,255,${Math.random()*.45+.08})`;sx.fill();
  }
})();

/* ── Shared constants ── */
const COLORS=[
  {fill:'rgba(130,70,210,.88)', stroke:'#a060e8', light:'#c090ff'},
  {fill:'rgba(50, 90,210,.88)', stroke:'#5080f0', light:'#80b0ff'},
  {fill:'rgba(30,155,200,.88)', stroke:'#30b8e8', light:'#60d8ff'},
  {fill:'rgba(40,175, 90,.88)', stroke:'#40cc70', light:'#70ee99'},
  {fill:'rgba(195,200, 40,.88)',stroke:'#d8d850', light:'#f0f070'},
  {fill:'rgba(220,120, 30,.88)',stroke:'#f09030', light:'#ffb850'},
  {fill:'rgba(210, 40, 55,.88)',stroke:'#f03050', light:'#ff6070'},
];
const N=7, SCALE=1/Math.sqrt(7), ROT=Math.PI/7;
const AD=65, HOLD=25;
const TOTAL=(N*(AD+HOLD))+80;

let t=0, playing=true, raf;
let globalRot = 0, userRot = 0;
let isDragging = false, lastX = 0;

window.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; });
window.addEventListener('mousemove', e => { 
  if(isDragging) { 
    userRot += (e.clientX - lastX) * 0.01; 
    lastX = e.clientX; 
  }
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('touchstart', e => { isDragging = true; lastX = e.touches[0].clientX; });
window.addEventListener('touchmove', e => { 
  if(isDragging) { 
    userRot += (e.touches[0].clientX - lastX) * 0.01; 
    lastX = e.touches[0].clientX; 
  }
});
window.addEventListener('touchend', () => { isDragging = false; });

function ease(x){return 1-Math.pow(1-x,3);}

/* ══════════════════════════════
   2D CANVAS
══════════════════════════════ */
const c2=document.getElementById('c2d');
const x2=c2.getContext('2d');
const CX2=c2.width/2, CY2=c2.height/2, R2=165;

function hept2(cx,cy,r,rot){
  x2.beginPath();
  for(let i=0;i<7;i++){
    const a=rot+(2*Math.PI*i/7)-Math.PI/2;
    i===0?x2.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a))
         :x2.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  x2.closePath();
}

function draw2d(){
  x2.clearRect(0,0,c2.width,c2.height);
  const g=x2.createRadialGradient(CX2,CY2,0,CX2,CY2,R2+10);
  g.addColorStop(0,'rgba(70,30,150,.18)');g.addColorStop(1,'rgba(0,0,0,0)');
  x2.fillStyle=g;x2.fillRect(0,0,c2.width,c2.height);

  for(let i=0;i<N;i++){
    const sf=i*(AD+HOLD);
    const p=Math.min(1,Math.max(0,(t-sf)/AD));
    if(p<=0)continue;
    const ep=ease(p);
    const r=R2*Math.pow(SCALE,i)*ep;
    const rot=ROT*i + globalRot + userRot;
    x2.save();
    x2.globalAlpha=0.15+ep*.85;
    x2.shadowColor=COLORS[i].stroke;x2.shadowBlur=16*ep;
    hept2(CX2,CY2,r,rot);
    x2.fillStyle=COLORS[i].fill;x2.fill();
    x2.strokeStyle=COLORS[i].stroke;x2.lineWidth=1.8;x2.stroke();
    x2.restore();
  }
  const top=Math.min(N-1,Math.floor(t/(AD+HOLD)));
  if(t>10){
    const rr=R2*Math.pow(SCALE,top);
    x2.save();x2.globalAlpha=.18+.1*Math.sin(t*.1);
    x2.shadowColor=COLORS[top].stroke;x2.shadowBlur=20;
    hept2(CX2,CY2,rr,ROT*top + globalRot + userRot + t*.006);
    x2.strokeStyle=COLORS[top].stroke;x2.lineWidth=1;x2.stroke();
    x2.restore();
  }
}

/* ══════════════════════════════
   3D CANVAS
══════════════════════════════ */
const c3=document.getElementById('c3d');
const x3=c3.getContext('2d');
const CX3=c3.width/2, CY3=c3.height/2+30, R3=155;

const ISO_ANGLE=Math.PI/6;

function iso(x,y,z){
  const px = x*Math.cos(ISO_ANGLE) - y*Math.cos(ISO_ANGLE);
  const py = x*Math.sin(ISO_ANGLE) + y*Math.sin(ISO_ANGLE) - z;
  return [CX3+px, CY3+py];
}

function heptPts(r,rot,z){
  const pts=[];
  for(let i=0;i<7;i++){
    const a=rot+(2*Math.PI*i/7)-Math.PI/2;
    pts.push([r*Math.cos(a), r*Math.sin(a), z]);
  }
  return pts;
}

function poly3(pts,fillStyle,strokeStyle,alpha=1){
  x3.beginPath();
  const [px0,py0]=iso(...pts[0]);
  x3.moveTo(px0,py0);
  for(let i=1;i<pts.length;i++){const [px,py]=iso(...pts[i]);x3.lineTo(px,py);}
  x3.closePath();
  x3.globalAlpha=alpha;
  if(fillStyle){x3.fillStyle=fillStyle;x3.fill();}
  if(strokeStyle){x3.strokeStyle=strokeStyle;x3.lineWidth=1.2;x3.stroke();}
}

function sideFace(p1,p2,bottomZ,fillStyle,alpha){
  const pts=[
    [p1[0],p1[1],p1[2]],
    [p2[0],p2[1],p2[2]],
    [p2[0],p2[1],bottomZ],
    [p1[0],p1[1],bottomZ],
  ];
  poly3(pts,fillStyle,null,alpha);
}

function hexToRgba(hex,a){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const PRISM_H=[90,72,56,42,30,20,12];

function draw3d(){
  x3.clearRect(0,0,c3.width,c3.height);
  const g=x3.createRadialGradient(CX3,CY3+20,0,CX3,CY3+20,R3+20);
  g.addColorStop(0,'rgba(30,60,120,.2)');g.addColorStop(1,'rgba(0,0,0,0)');
  x3.fillStyle=g;x3.fillRect(0,0,c3.width,c3.height);

  for(let i=0;i<N;i++){
    const sf=i*(AD+HOLD);
    const p=Math.min(1,Math.max(0,(t-sf)/AD));
    if(p<=0)continue;
    const ep=ease(p);

    const r=R3*Math.pow(SCALE,i);
    const rot=ROT*i + globalRot + userRot;
    const h=PRISM_H[i]*ep;
    const topZ=h;
    const botZ=0;

    const topPts=heptPts(r*ep,rot,topZ);

    const col=COLORS[i];
    const alpha=0.15+ep*.82;

    x3.save();
    x3.shadowColor=col.stroke;x3.shadowBlur=10*ep;
    for(let k=0;k<7;k++){
      const k2=(k+1)%7;
      const midA=rot+(2*Math.PI*(k+.5)/7)-Math.PI/2;
      if(Math.sin(midA+Math.PI/4)>-0.1){
        sideFace(topPts[k],topPts[k2],botZ,hexToRgba(col.stroke,.55*ep),alpha*.9);
      }
    }
    poly3(topPts, col.fill, col.stroke, alpha);
    x3.restore();
  }
}

/* ── Main loop ── */
function loop(){
  if(playing){
    t++;
    if(t>TOTAL)t=TOTAL;
    globalRot += 0.005;
  }
  draw2d();
  draw3d();
  raf=requestAnimationFrame(loop);
}

document.getElementById('btnPlay').addEventListener('click',function(){
  playing=!playing;
  this.textContent=playing?'⏸ DURDUR':'▶ DEVAM';
});
document.getElementById('btnReset').addEventListener('click',function(){
  t=0;playing=true;globalRot=0;userRot=0;
  document.getElementById('btnPlay').textContent='⏸ DURDUR';
});

loop();
</script>
</body>
</html>
