<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yedigen Spiral — İnceleme Modu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital@0;1&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#070712;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
  font-family:'Crimson Text',serif;
}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1035 0%,#07071200 65%);z-index:0;pointer-events:none;}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

header{z-index:10;text-align:center;margin-bottom:.7rem;pointer-events:none;user-select:none;}
header h1{font-family:'Cinzel',serif;color:#c8a96e;font-size:1rem;letter-spacing:.35em;text-shadow:0 0 24px rgba(200,169,110,.55);}
header p{color:#7766aa;font-size:.72rem;letter-spacing:.12em;font-style:italic;margin-top:.2rem;}

.tabs{
  z-index:10;display:flex;margin-bottom:.7rem;border-radius:3px;overflow:hidden;
}
.tab{
  font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.22em;
  padding:.38rem 1.1rem;color:#7766aa;cursor:pointer;
  border:1px solid #332266;background:transparent;
  transition:all .22s;user-select:none;
}
.tab.active{background:rgba(85,51,170,.45);color:#c8a96e;border-color:#7744cc;}
.tab:hover:not(.active){background:rgba(85,51,170,.15);color:#aa88ee;}

.stage{z-index:10;position:relative;}
canvas{border-radius:6px;display:block;}
#c2d{filter:drop-shadow(0 0 28px rgba(120,80,220,.55));cursor:grab;}
#c3d{filter:drop-shadow(0 0 28px rgba(80,160,220,.55));cursor:grab;}
#c2d:active,#c3d:active{cursor:grabbing;}

/* HUD overlay */
.hud{
  position:absolute;top:10px;right:10px;
  z-index:20;display:flex;flex-direction:column;gap:.3rem;
  pointer-events:none;user-select:none;
}
.hud-item{
  font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.15em;
  color:#8866cc;padding:.2rem .5rem;
  border:1px solid #33224466;border-radius:2px;
  background:rgba(7,7,18,.65);text-align:right;
}

/* zoom ring hint */
.zoom-ring{
  position:absolute;bottom:10px;left:10px;
  z-index:20;pointer-events:none;user-select:none;
  font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.12em;
  color:#443366;
}

.controls{z-index:10;display:flex;gap:.7rem;margin-top:.8rem;align-items:center;}
button{
  font-family:'Cinzel',serif;background:transparent;
  border:1px solid #5533aa;color:#c8a96e;
  padding:.38rem 1rem;font-size:.62rem;letter-spacing:.18em;cursor:pointer;
  transition:all .3s;border-radius:2px;
}
button:hover{background:rgba(85,51,170,.3);border-color:#c8a96e;box-shadow:0 0 12px rgba(200,169,110,.22);}
.sep{color:#332255;font-size:.8rem;user-select:none;}
.zoom-label{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.15em;color:#7766aa;min-width:52px;text-align:center;}

.formula{
  z-index:10;color:#3a2a55;font-size:.68rem;font-style:italic;
  margin-top:.5rem;letter-spacing:.05em;text-align:center;
  pointer-events:none;user-select:none;
}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>

<header>
  <h1>Yedigen Spiral Daralma Modeli</h1>
  <p>Sürükle: Döndür &nbsp;·&nbsp; Tekerlek / Sıkıştır: Yakınlaştır &nbsp;·&nbsp; Shift+Sürükle: Eğ</p>
</header>

<div class="tabs">
  <div class="tab active" id="tab2d">2 Boyutlu</div>
  <div class="tab" id="tab3d">3 Boyutlu</div>
  <div class="tab" id="tabBoth">İkisi Birden</div>
</div>

<div class="stage" id="stage">
  <canvas id="c2d" width="580" height="580"></canvas>
  <canvas id="c3d" width="580" height="580" style="display:none"></canvas>
  <div class="hud">
    <div class="hud-item" id="hudZoom">ZOOM 1.00×</div>
    <div class="hud-item" id="hudRot">ROT 0°</div>
    <div class="hud-item" id="hudTilt">TİLT 0°</div>
  </div>
  <div class="zoom-ring" id="zoomRing">scroll → zoom</div>
</div>

<div class="controls">
  <button id="btnPlay">⏸ DURDUR</button>
  <button id="btnReset">↺ TEKRAR</button>
  <div class="sep">|</div>
  <button id="btnZoomOut">－</button>
  <div class="zoom-label" id="zoomLabel">1.0×</div>
  <button id="btnZoomIn">＋</button>
  <div class="sep">|</div>
  <button id="btnResetView">⊙ GÖRÜNÜM</button>
</div>
<div class="formula">Her yedigenin alanı öncekinin 1/7'si &nbsp;·&nbsp; SCALE = 1/√7</div>

<script>
/* ── Stars ── */
(()=>{
  const sc=document.getElementById('stars');
  sc.width=window.innerWidth; sc.height=window.innerHeight;
  const sx=sc.getContext('2d');
  for(let i=0;i<170;i++){
    sx.beginPath();
    sx.arc(Math.random()*sc.width,Math.random()*sc.height,Math.random()*1.3,0,Math.PI*2);
    sx.fillStyle=`rgba(255,255,255,${Math.random()*.5+.06})`;
    sx.fill();
  }
})();

/* ── Constants ── */
// Her katman için: fill (iç dolgu), stroke (kenar çizgisi), glow (ışıma rengi)
// Dıştan içe: derin mor → kraliyet mavisi → okyanus → zümrüt → altın → bakır → kor kırmızı
const COLORS=[
  { // 1. katman — derin galaktik mor
    fill:'rgba(72,0,130,.72)',
    stroke:'#9b30ff',
    glow:'#7b00ff'
  },
  { // 2. katman — kraliyet kobalt
    fill:'rgba(20,40,180,.75)',
    stroke:'#4488ff',
    glow:'#2255ff'
  },
  { // 3. katman — okyanus turkuaz
    fill:'rgba(0,140,180,.75)',
    stroke:'#00e5ff',
    glow:'#00ccff'
  },
  { // 4. katman — zümrüt yeşil
    fill:'rgba(0,160,80,.72)',
    stroke:'#00ff99',
    glow:'#00dd88'
  },
  { // 5. katman — saf altın
    fill:'rgba(210,165,0,.78)',
    stroke:'#ffd700',
    glow:'#ffcc00'
  },
  { // 6. katman — yanık bakır / amber
    fill:'rgba(200,80,10,.78)',
    stroke:'#ff8c00',
    glow:'#ff6600'
  },
  { // 7. katman (merkez) — kor kırmızı / lav
    fill:'rgba(180,10,30,.82)',
    stroke:'#ff2244',
    glow:'#ff0033'
  },
];
const N=7, SCALE=1/Math.sqrt(7), ROT=Math.PI/7;
const AD=65, HOLD=25;
const TOTAL=(N*(AD+HOLD))+80;

let t=0, playing=true, globalRot=0;

/* ── View state ── */
let zoom=1;
const ZOOM_MIN=0.25, ZOOM_MAX=8;
let rotY=0;   // horizontal (all modes)
let rotX=0;   // vertical tilt (3D + 2D shift-drag)

/* ── Drag state ── */
let isDragging=false, lastX=0, lastY=0;
let pinchDist=null;

/* ── Mode ── */
let mode='2d';

function ease(x){return 1-Math.pow(1-x,3);}

/* ══════════════════════════════
   2D
══════════════════════════════ */
const c2=document.getElementById('c2d');
const x2=c2.getContext('2d');

function hept2(cx,cy,r,rot){
  x2.beginPath();
  for(let i=0;i<7;i++){
    const a=rot+(2*Math.PI*i/7)-Math.PI/2;
    i===0 ? x2.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a))
           : x2.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  x2.closePath();
}

function draw2d(){
  const W=c2.width, H=c2.height, CX=W/2, CY=H/2;
  const R=Math.min(W,H)*0.43 * zoom;
  x2.clearRect(0,0,W,H);
  const g=x2.createRadialGradient(CX,CY,0,CX,CY,R+20);
  g.addColorStop(0,'rgba(70,30,150,.2)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x2.fillStyle=g; x2.fillRect(0,0,W,H);

  for(let i=0;i<N;i++){
    const sf=i*(AD+HOLD);
    const p=Math.min(1,Math.max(0,(t-sf)/AD));
    if(p<=0) continue;
    const ep=ease(p);
    const r=R*Math.pow(SCALE,i)*ep;
    const rot=ROT*i + globalRot + rotY;
    x2.save();
    // dış glow halkası
    x2.globalAlpha=0.22*ep;
    x2.shadowColor=COLORS[i].glow; x2.shadowBlur=40*ep;
    hept2(CX,CY,r*1.04,rot);
    x2.strokeStyle=COLORS[i].glow; x2.lineWidth=5; x2.stroke();
    // ana şekil
    x2.globalAlpha=0.18+ep*.82;
    x2.shadowColor=COLORS[i].glow; x2.shadowBlur=20*ep;
    hept2(CX,CY,r,rot);
    x2.fillStyle=COLORS[i].fill; x2.fill();
    x2.strokeStyle=COLORS[i].stroke; x2.lineWidth=2; x2.stroke();
    x2.restore();
  }
  const top=Math.min(N-1,Math.floor(t/(AD+HOLD)));
  if(t>10){
    const rr=R*Math.pow(SCALE,top);
    x2.save(); x2.globalAlpha=.18+.1*Math.sin(t*.1);
    x2.shadowColor=COLORS[top].stroke; x2.shadowBlur=24;
    hept2(CX,CY,rr,ROT*top + globalRot + rotY + t*.006);
    x2.strokeStyle=COLORS[top].stroke; x2.lineWidth=1; x2.stroke();
    x2.restore();
  }
}

/* ══════════════════════════════
   3D  — Full orbit projection
══════════════════════════════ */
const c3=document.getElementById('c3d');
const x3=c3.getContext('2d');

function project(px,py,pz, CX,CY){
  // 1. Rotate around Y axis (horizontal spin)
  const cy=Math.cos(rotY), sy=Math.sin(rotY);
  const x1 =  px*cy + py*sy;
  const y1 = -px*sy + py*cy;
  const z1 =  pz;
  // 2. Rotate around X axis (tilt up/down)
  const cx=Math.cos(rotX), sx2=Math.sin(rotX);
  const y2 = y1*cx - z1*sx2;
  const z2 = y1*sx2 + z1*cx;
  // 3. Perspective
  const fov=600;
  const sc=fov/(fov + z2*0.25);
  return [CX + x1*sc*zoom, CY - y2*sc*zoom];
}

function heptPts3(r,rot,z){
  const pts=[];
  for(let i=0;i<7;i++){
    const a=rot+(2*Math.PI*i/7)-Math.PI/2;
    pts.push([r*Math.cos(a), r*Math.sin(a), z]);
  }
  return pts;
}

function poly3d(pts,fill,stroke,alpha,CX,CY){
  x3.beginPath();
  const [px0,py0]=project(...pts[0],CX,CY);
  x3.moveTo(px0,py0);
  for(let i=1;i<pts.length;i++){
    const [px,py]=project(...pts[i],CX,CY);
    x3.lineTo(px,py);
  }
  x3.closePath();
  x3.globalAlpha=alpha;
  if(fill){x3.fillStyle=fill;x3.fill();}
  if(stroke){x3.strokeStyle=stroke;x3.lineWidth=1.3;x3.stroke();}
}

function side3d(p1,p2,bz,fill,alpha,CX,CY){
  poly3d([
    [p1[0],p1[1],p1[2]],
    [p2[0],p2[1],p2[2]],
    [p2[0],p2[1],bz],
    [p1[0],p1[1],bz],
  ],fill,null,alpha,CX,CY);
}

function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const PRISM_H=[90,72,56,42,30,20,12];

function draw3d(){
  const W=c3.width,H=c3.height,CX=W/2,CY=H/2+15;
  const R=Math.min(W,H)*0.40;
  x3.clearRect(0,0,W,H);
  const g=x3.createRadialGradient(CX,CY,0,CX,CY,R+30);
  g.addColorStop(0,'rgba(30,60,120,.22)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x3.fillStyle=g; x3.fillRect(0,0,W,H);

  for(let i=0;i<N;i++){
    const sf=i*(AD+HOLD);
    const p=Math.min(1,Math.max(0,(t-sf)/AD));
    if(p<=0) continue;
    const ep=ease(p);
    const r=R*Math.pow(SCALE,i);
    const rot=ROT*i + globalRot;
    const h=PRISM_H[i]*ep;
    const topPts=heptPts3(r*ep,rot,h);
    const col=COLORS[i];
    const alpha=0.18+ep*.80;
    x3.save();
    x3.shadowColor=col.glow; x3.shadowBlur=22*ep;
    // yan yüzler — alttan karanlık, üstten parlak geçiş
    for(let k=0;k<7;k++){
      const k2=(k+1)%7;
      // yan yüz daha koyu dolgu + parlak kenar
      side3d(topPts[k],topPts[k2],0, hexToRgba(col.stroke,.38*ep), alpha*.75, CX,CY);
    }
    // üst yüz — tam dolu + glow
    poly3d(topPts, col.fill, col.stroke, alpha, CX,CY);
    // üst yüz üstüne parlama katmanı
    x3.globalAlpha=0.18*ep;
    x3.shadowColor=col.glow; x3.shadowBlur=35*ep;
    poly3d(topPts, col.glow, null, 0.18*ep, CX,CY);
    x3.restore();
  }
}

/* ══════════════════════════════
   HUD
══════════════════════════════ */
function updateHUD(){
  document.getElementById('hudZoom').textContent=`ZOOM ${zoom.toFixed(2)}×`;
  const deg=r=>Math.round(((r*180/Math.PI)%360+360)%360);
  document.getElementById('hudRot').textContent=`ROT ${deg(rotY)}°`;
  document.getElementById('hudTilt').textContent=`TİLT ${Math.round(rotX*180/Math.PI)}°`;
  document.getElementById('zoomLabel').textContent=`${zoom.toFixed(1)}×`;
}

/* ══════════════════════════════
   Pointer / wheel events
══════════════════════════════ */
window.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('mousemove',e=>{
  if(!isDragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  rotY += dx*0.013;
  rotX += dy*0.013;
  updateHUD();
});
window.addEventListener('mouseup',()=>isDragging=false);

window.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor = e.deltaY>0 ? 0.92 : 1.09;
  zoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoom*factor));
  updateHUD();
},{passive:false});

// Touch
window.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    isDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; pinchDist=null;
  } else if(e.touches.length===2){
    isDragging=false;
    pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});

window.addEventListener('touchmove',e=>{
  if(e.touches.length===1 && isDragging){
    const dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    rotY+=dx*0.013;
    rotX+=dy*0.013;
    updateHUD();
  } else if(e.touches.length===2 && pinchDist!==null){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoom*(d/pinchDist)));
    pinchDist=d; updateHUD();
  }
},{passive:true});
window.addEventListener('touchend',()=>{isDragging=false;pinchDist=null;});

/* ── Buttons ── */
document.getElementById('btnZoomIn').addEventListener('click',()=>{zoom=Math.min(ZOOM_MAX,zoom*1.3);updateHUD();});
document.getElementById('btnZoomOut').addEventListener('click',()=>{zoom=Math.max(ZOOM_MIN,zoom/1.3);updateHUD();});
document.getElementById('btnResetView').addEventListener('click',()=>{zoom=1;rotY=0;rotX=0;updateHUD();});
document.getElementById('btnPlay').addEventListener('click',function(){
  playing=!playing; this.textContent=playing?'⏸ DURDUR':'▶ DEVAM';
});
document.getElementById('btnReset').addEventListener('click',function(){
  t=0;playing=true;globalRot=0;
  document.getElementById('btnPlay').textContent='⏸ DURDUR';
});

/* ── Tabs ── */
function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
  const stage=document.getElementById('stage');
  if(m==='both'){
    c2.width=390;c2.height=390;c3.width=390;c3.height=390;
    c2.style.display='inline-block';c3.style.display='inline-block';
    stage.style.display='flex';stage.style.gap='1.2rem';
  } else {
    c2.width=580;c2.height=580;c3.width=580;c3.height=580;
    stage.style.display='block';
    c2.style.display=m==='2d'?'block':'none';
    c3.style.display=m==='3d'?'block':'none';
  }
}
document.getElementById('tab2d').addEventListener('click',()=>setMode('2d'));
document.getElementById('tab3d').addEventListener('click',()=>setMode('3d'));
document.getElementById('tabBoth').addEventListener('click',()=>setMode('both'));

/* ── Loop ── */
function loop(){
  if(playing){
    t++; if(t>TOTAL)t=TOTAL;
    globalRot+=0.005;
  }
  if(mode==='2d'||mode==='both') draw2d();
  if(mode==='3d'||mode==='both') draw3d();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
